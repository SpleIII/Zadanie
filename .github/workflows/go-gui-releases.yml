name: Go GUI CI/CD (Releases)

on:
  push:
    branches: [main]
    tags: ['hello-gui-v*']
    paths:
      - 'projects/hello-gui/**'
      - '.github/workflows/go-gui-releases.yml'
  pull_request:
    paths:
      - 'projects/hello-gui/**'
      - '.github/workflows/go-gui-releases.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/hello-gui

jobs:
  test:
    name: Проверки
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Подключить Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Установить зависимости GUI (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Проверить форматирование
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Файлы без gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Прогнать go vet
        run: go vet ./...

      - name: Выполнить тесты
        run: go test ./... -v

      - name: Собрать бинарник (проверка сборки)
        run: go build -o /tmp/hello-gui .

  release:
    name: Публикация релиза
    needs: test
    if: startsWith(github.ref, 'refs/tags/hello-gui-')
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: hello-gui-linux-x64
            extra_ldflags: ""
          - os: macos-14
            artifact: hello-gui-macos-arm64
            extra_ldflags: ""
          - os: windows-latest
            artifact: hello-gui-windows-x64.exe
            extra_ldflags: "-H windowsgui"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Подключить Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Установить зависимости GUI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Подключить MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Прописать CC для Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gccPath = Join-Path $env:RUNNER_TEMP "msys64\mingw64\bin\gcc.exe"
          if (-not (Test-Path $gccPath)) {
            $gccPath = "C:\msys64\mingw64\bin\gcc.exe"
          }
          if (-not (Test-Path $gccPath)) {
            $found = Get-ChildItem -Path $env:RUNNER_TEMP -Filter "gcc.exe" -Recurse -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -like "*mingw64*" } |
                     Select-Object -First 1
            if ($found) { $gccPath = $found.FullName }
          }
          if (-not (Test-Path $gccPath)) {
            throw "gcc.exe not found. Checked: $gccPath"
          }
          $gccUnix = $gccPath -replace '\\', '/'
          $gccDir = (Split-Path $gccPath -Parent) -replace '\\', '/'
          echo "CC=$gccUnix" >> $env:GITHUB_ENV
          echo "$gccDir" >> $env:GITHUB_PATH

      - name: Собрать GUI-бинарник
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
          VERSION="${GITHUB_REF_NAME#hello-gui-}"
          go build \
            -ldflags="-s -w ${{ matrix.extra_ldflags }} -X main.version=$VERSION" \
            -o ${{ matrix.artifact }} .

      - name: Прикрепить файлы к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
