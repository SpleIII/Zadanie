name: Go CI/CD (Releases)

on:
  push:
    branches: [main]
    tags: ['hello-go-releases-v*']
    paths:
      - 'projects/hello-go-releases/**'
      - '.github/workflows/go-releases.yml'
  pull_request:
    paths:
      - 'projects/hello-go-releases/**'
      - '.github/workflows/go-releases.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/hello-go-releases

jobs:
  test:
    name: Проверки
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Подключить Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Проверить форматирование
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Файлы без gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Прогнать go vet
        run: go vet ./...

      - name: Выполнить тесты
        run: go test ./... -v

      - name: Собрать бинарник (проверка сборки)
        run: CGO_ENABLED=0 go build -o hello-go .

  release:
    name: Публикация релиза
    needs: test
    if: startsWith(github.ref, 'refs/tags/hello-go-releases-')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Подключить Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Собрать бинарник под платформу
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#hello-go-releases-}"
          go build \
            -ldflags="-s -w -X main.version=$VERSION" \
            -o hello-go-${{ matrix.suffix }} .

      - name: Прикрепить файлы к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: hello-go-${{ matrix.suffix }}
          generate_release_notes: true
