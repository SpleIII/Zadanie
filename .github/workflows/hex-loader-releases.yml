name: Hex Loader CI/CD (Releases)

on:
  push:
    branches: [main]
    tags: ['hex-loader-v*']
    paths:
      - 'projects/hex-loader/**'
      - '.github/workflows/hex-loader-releases.yml'
  pull_request:
    paths:
      - 'projects/hex-loader/**'
      - '.github/workflows/hex-loader-releases.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/hex-loader

permissions:
  contents: write

jobs:
  test:
    name: Проверка сборки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Установить зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Собрать бинарник
        run: go build -o hex-loader .

  release:
    name: Публикация релиза
    needs: test
    if: startsWith(github.ref, 'refs/tags/hex-loader-')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: hex-loader-linux-x64
            ext: ""
          - os: macos-latest
            artifact: hex-loader-macos-arm64
            ext: ""
          - os: windows-latest
            artifact: hex-loader-windows-x64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Установить зависимости (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Собрать бинарник
        run: go build -o ${{ matrix.artifact }}${{ matrix.ext }} .
      - uses: softprops/action-gh-release@v2
        with:
          files: projects/hex-loader/${{ matrix.artifact }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
