name: Rust CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'projects/hello-rust/**'
      - '.github/workflows/rust-ghcr.yml'
  pull_request:
    paths:
      - 'projects/hello-rust/**'
      - '.github/workflows/rust-ghcr.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/hello-rust

jobs:
  build:
    name: Проверка и сборка образа
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Подключить Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Кэш Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            projects/hello-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('projects/hello-rust/**/Cargo.toml') }}

      - name: Проверить форматирование
        run: cargo fmt --check

      - name: Прогнать Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Выполнить тесты
        run: cargo test

      - name: Собрать release-сборку
        run: cargo build --release

      - name: Авторизоваться в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовить Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Собрать метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/spleiii/zadanie/hello-rust
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Собрать и отправить образ
        uses: docker/build-push-action@v5
        with:
          context: projects/hello-rust
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
