name: React SPA CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'projects/hello-pages/**'
      - '.github/workflows/pages-spa.yml'
  pull_request:
    paths:
      - 'projects/hello-pages/**'
      - '.github/workflows/pages-spa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-spa"
  cancel-in-progress: false

defaults:
  run:
    working-directory: projects/hello-pages

jobs:
  build:
    name: Сборка SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Установить зависимости
        run: npm install
      - name: Собрать проект
        run: npm run build
      - name: Сохранить сборку как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: pages-spa-dist
          path: projects/hello-pages/dist

  # Деплой включается переменной репозитория DEPLOY_SPA=true.
  # По умолчанию слот GitHub Pages в этом репозитории занят статическим
  # сайтом из projects/hello-static — две публикации в один Pages невозможны.
  deploy:
    name: Публикация на Pages
    needs: build
    if: vars.DEPLOY_SPA == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-spa-dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
