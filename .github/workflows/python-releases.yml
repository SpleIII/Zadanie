name: Python CI/CD (Releases)

on:
  push:
    branches: [main]
    tags: ['hello-python-v*']
    paths:
      - 'projects/hello-python/**'
      - '.github/workflows/python-releases.yml'
  pull_request:
    paths:
      - 'projects/hello-python/**'
      - '.github/workflows/python-releases.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/hello-python

jobs:
  test:
    name: Проверки
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Подключить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Прогнать ruff
        run: |
          pip install ruff==0.7.1
          ruff check .
          ruff format --check .

      - name: Выполнить тесты
        run: python -m pytest -v

  release:
    name: Публикация релиза
    needs: test
    if: startsWith(github.ref, 'refs/tags/hello-python-')
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: hello-python-linux-x64
          - os: macos-14
            artifact: hello-python-macos-arm64
          - os: windows-latest
            artifact: hello-python-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Подключить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Собрать бинарник через PyInstaller
        run: python -m PyInstaller --onefile --name hello-python main.py

      - name: Переименовать бинарник (Unix)
        if: runner.os != 'Windows'
        run: mv dist/hello-python dist/${{ matrix.artifact }}

      - name: Переименовать бинарник (Windows)
        if: runner.os == 'Windows'
        run: mv dist/hello-python.exe dist/${{ matrix.artifact }}

      - name: Прикрепить файлы к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          generate_release_notes: true
