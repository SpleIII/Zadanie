name: Check Tasks

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/check-tasks.yml'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Проверка репозиториев заданий
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Убедиться, что все задания на месте
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          failed=0

          for repo in \
            hello-rust \
            hello-go \
            hello-go-releases \
            hello-python \
            hello-dotnet \
            hello-gui \
            hex-loader \
            arduino-manager \
            hello-static \
            hello-pages
          do
            # Метаданные репозитория: существование и архивность.
            code=$(curl -s -o /tmp/meta.json -w '%{http_code}' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/SpleIII/$repo")

            if [ "$code" != "200" ]; then
              echo "FAIL $repo — недоступен (HTTP $code)"
              failed=1
              continue
            fi

            if grep -q '"archived":true' /tmp/meta.json; then
              echo "FAIL $repo — архивирован"
              failed=1
              continue
            fi

            # Содержимое: в репозитории задания должны быть файлы.
            code=$(curl -s -o /tmp/files.json -w '%{http_code}' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/SpleIII/$repo/contents/")

            if [ "$code" != "200" ]; then
              echo "FAIL $repo — не удалось прочитать содержимое (HTTP $code)"
              failed=1
              continue
            fi

            files=$(grep -c '"type":"file"' /tmp/files.json || true)
            if [ "${files:-0}" -lt 1 ]; then
              echo "FAIL $repo — пустой репозиторий"
              failed=1
              continue
            fi

            echo "OK $repo — на месте, файлов: $files"
          done

          if [ "$failed" -ne 0 ]; then
            echo "Индекс ссылается на недоступные задания."
            exit 1
          fi

          echo "Все 10 заданий доступны."
